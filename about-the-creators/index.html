<!DOCTYPE html>
<html lang="en" style = "overscroll-behavior: none;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILALO Chemistry</title>
    <link rel = "stylesheet" href = "/navbar.css">
    <link rel = "stylesheet" href = "/text-styles.css">
    <link rel = "stylesheet" href = "/footer.css">
    <link rel="icon" type="image/x-icon" href="/images/website-icon.png">
</head>
<style>
    @keyframes fade-in{
        from{
            opacity: 0;
            transform: translateY(20px);
        }
    }
    body{
        width: 100vw;
        height: 100vh;
        background-color: rgb(10, 29, 70);
        display: flex;
    }
    main{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex: 1;
        margin-top: 70px;
        animation: fade-in 1.5s forwards;
        padding-bottom: 50px;
    }
    .site-topic{
        font-size: clamp(60px, 8vw, 140px);
        color: white;
        font-family: bebas-neue;
        margin: 25px;
        text-align: center;
    }
    .bio-text{
        display: flex;
        height: 100%;
        align-items: flex-start;
        justify-content: center;
        flex-direction: column;
        margin-left: 3em;
    }
    .bio-container{
        width: 50%;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        color: white;
        border: 2px solid white;
        box-sizing: content-box;
        padding: 30px;
        margin: 20px;
    }
    .bio-photo{
        width: clamp(175px,30vw,400px);
    }
    .name{
        font-weight: 600;
        font-size: clamp(25px,3vw,100px) !important;
    }
    .description{
        font-weight: 200;
        font-size: clamp(12px,1.5vw,50px) !important;
    }
    @media (max-width: 768px){
        .bio-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .name{
            text-align: center;
        }
        .description{
            text-align: center;
        }
        .bio-text{
            margin-left: 0 !important;
            margin-top: 20px;
            justify-content: center;
            align-items: center;
        }
    }
    


</style>
<body style = "margin: 0; overflow-x: hidden; display: flex; flex-direction: column; position: relative; overscroll-behavior: none;">
    <!-- NAVIGATION MENU, REUSE CODE FOR OTHER PAGES-->
    <header id = "header">
        <script src = "/navbar.js"></script>
    </header>
    <!-- ITEMS UNIQUE TO THE HOMEPAGE-->
    <main style = "overscroll-behavior: none;">
        <h1 class = "site-topic">About the Creators</h1>
        <div class = "bio-container">
            <img class = "bio-photo" src = "/images/placeholder.jpg">
            <div class = "bio-text">
                <h1 class = "name">Kaili Gamos</h1>
                <p class = "description">Content Creator</p>
            </div>
        </div>
        <div class = "bio-container">
            <img class = "bio-photo" src = "/images/placeholder.jpg">
            <div class = "bio-text">
                <h1 class = "name">Jerry Liang</h1>
                <p class = "description">Website Developer</p>
            </div>
        </div>
    </main>

    <footer>
         <script src = "/footer.js"></script>
    </footer>

</body>
</html>
